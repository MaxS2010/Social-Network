{% load static %}

<div>
    <div class="profile-head">
        <div class="profile-picture">
            <img src="{% static  'icons/example-photo.png' %}" alt="example-photo.png">
        </div>
        <div class="profile-name">
            <h3>{{ user.first_name }} {{ user.last_name }}</h3>
            <p>@{{ user.username }}</p>
        </div>
    </div>

    <div class="profile-info">
        <div class="info-container">
            <h3>566</h3>                       
            <p>Дописи</p>
        </div>
        <div class="info-container">
            <h3>12.1K</h3>                                
            <p>Читачі</p>
        </div>
        <div class="info-container">
            <h3>222</h3>                   
            <p>Друзі</p>
        </div>
    </div>
</div>
