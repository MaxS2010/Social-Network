<div class="profile-container"> 
    {% include 'particles/header_content.html' %}

    <div class="buttons-container">
        {% if section == "requests" %}
            <button type="button" data-friend-action data-url="{% url 'friend_action' profile_user.id 'accept' %}" data-section="{{ section }}">
                Підтвердити
            </button>
    
            <button type="button" data-friend-action data-url="{% url 'friend_action' profile_user.id 'delete' %}">
                Відхилити
            </button>
    
        {% elif section == "recommendations" %}
            <button type="button" data-friend-action data-url="{% url 'friend_action' profile_user.id 'add' %}" data-section="{{ section }}">
                Додати
            </button>
    
            <button type="button" data-friend-action data-url="{% url 'friend_action' profile_user.id 'dismiss' %}">
                Видалити
            </button>
    
        {% elif section == "friends" %}
            <button type="button">
                Повідомлення
            </button>
    
            <button type="button" data-friend-action data-url="{% url 'friend_action' profile_user.id 'delete' %}" >
                Видалити
            </button>
        {% endif %}
    </div>
</div>
